services:
  - type: web
    name: realcheck-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set these in the Render Dashboard (Environment) — do not commit secrets:
      # SMTP_EMAIL, SMTP_PASSWORD, SECRET_KEY, DATABASE_URL (optional Postgres)
