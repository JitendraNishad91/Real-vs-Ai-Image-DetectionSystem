version: '3.8'

services:
  backend:
    build: ./backend
    container_name: realcheck-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-db:/app/data
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: realcheck-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: always

volumes:
  backend-db:
